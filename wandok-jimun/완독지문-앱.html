<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>완독지문 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="1,189장 완독 기록으로 1 OF 1 지문 포스터와 완독 증명서를 만드는 웹앱.">
<meta name="theme-color" content="#0f0f0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Gothic+A1:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 왼쪽은 작업대(캔버스가 화면을 채움), 오른쪽은 굵은 선으로 나뉜 입력 패널. 폰에서는 위아래로 쌓임.
   한 가지 세계로 고정한 다크 앱이라 테마 토글을 따르지 않고 모든 색을 직접 정함. */
:root{
  --ink:#0f0f0f; --paper:#efe9dc; --flame:#ff4d12; --acid:#d4ff3a;
  --bench:#191917; --line:#efe9dc; --dim:rgba(239,233,220,.58);
  --goth:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --anton:Anton,"Gothic A1",Impact,sans-serif;
  --mono:"Space Mono","Gothic A1",ui-monospace,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--goth);word-break:keep-all;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--acid);color:var(--ink)}
:focus-visible{outline:3px dashed var(--acid);outline-offset:3px}
.mono{font-family:var(--mono);font-size:12px;line-height:1.5}

.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:12px;padding-left:var(--gl);padding-right:var(--gr);border-bottom:3px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font:900 22px/1 var(--goth);letter-spacing:-.04em}
.brand b i{font-style:normal;color:var(--flame)}
.brand span{color:var(--dim)}
.tabs{display:flex;border:3px solid var(--line)}
.tabs a{display:flex;align-items:center;gap:8px;padding:9px 16px;font:900 15px/1 var(--goth);text-decoration:none;color:var(--paper)}
.tabs a+a{border-left:3px solid var(--line)}
.tabs a small{font:400 11px var(--mono);opacity:.65}
.tabs a[aria-current=page]{background:var(--acid);color:var(--ink)}
.tabs a[aria-current=page] small{opacity:.8}

.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,400px);min-height:0}
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bench);background-image:radial-gradient(rgba(239,233,220,.07) 1px,transparent 1.4px);background-size:18px 18px}
.canvas-zone{flex:1;min-height:0;display:grid;place-items:center;padding:28px}
.sheet{position:relative;box-shadow:12px 12px 0 var(--flame);border:3px solid var(--line);background:var(--ink);max-width:100%}
.sheet canvas{display:block;max-width:100%}
.readout{display:flex;flex-wrap:wrap;gap:0;border-top:3px solid var(--line)}
.readout div{flex:1 1 120px;padding:12px 16px;border-right:3px solid var(--line);min-width:0}
.readout div:last-child{border-right:0}
.readout b{display:block;font:400 26px/1 var(--anton);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.readout span{display:block;margin-top:5px;color:var(--dim);font:700 12px var(--goth)}
.readout .fp b{font:700 16px/1.6 var(--mono);color:var(--acid)}

.panel{border-left:3px solid var(--line);overflow-y:auto;min-height:0;background:var(--ink)}
.group{padding:20px 22px;border-bottom:3px solid var(--line);display:grid;gap:18px}
.group h2{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:900 20px/1 var(--goth);letter-spacing:-.03em}
.group h2 small{font:400 11px var(--mono);color:var(--dim);letter-spacing:0}
.field{display:grid;gap:3px;min-width:0}
.field>span em{font-style:normal;font-size:10px}
.field>span{display:flex;justify-content:space-between;gap:8px;font:800 12px var(--goth);color:var(--dim)}
.field input[type=text],.field input[type=date]{width:100%;min-width:0;border:0;border-bottom:3px solid var(--line);border-radius:0;background:transparent;font:900 26px/1.15 var(--goth);letter-spacing:-.035em;padding:2px 0 6px;-webkit-appearance:none;appearance:none}
.field input[type=date]{font:700 16px/1.4 var(--mono);letter-spacing:0;padding-block:6px 8px}
.field input:focus{outline:none;border-bottom-color:var(--acid)}
.field input::placeholder{color:rgba(239,233,220,.25)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:3px solid var(--line)}
.seg button{background:transparent;border:0;border-right:3px solid var(--line);padding:9px 2px 7px;font:900 15px/1.1 var(--goth);display:grid;gap:3px}
.seg button:last-child{border-right:0}
.seg button small{font:400 10px var(--mono);opacity:.6}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
.rng{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.rng output{font:400 36px/1 var(--anton);min-width:2.7ch;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--paper)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;background:var(--flame);border:3px solid var(--paper)}
input[type=range]::-moz-range-track{height:6px;background:var(--paper)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:0;background:var(--flame);border:3px solid var(--paper)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.chip{position:relative;height:58px;border:3px solid var(--line);background:var(--c0);padding:0;transition:transform .12s,box-shadow .12s}
.chip i{position:absolute;right:6px;top:6px;width:16px;height:16px;background:var(--c1);border:2px solid var(--ink)}
.chip span{position:absolute;left:5px;bottom:3px;font:700 9px var(--mono);color:var(--t)}
.chip[aria-pressed=true]{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--acid)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 14px;border:3px solid var(--paper);background:var(--acid);color:var(--ink);font:900 15px/1 var(--goth);box-shadow:5px 5px 0 var(--flame);text-decoration:none;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--flame)}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--flame)}
.btn.line{background:transparent;color:var(--paper)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn small{font:400 11px var(--mono)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;font:800 14px var(--goth);cursor:pointer}
.check input{-webkit-appearance:none;appearance:none;width:24px;height:24px;border:3px solid var(--paper);background:transparent;display:grid;place-items:center;flex:none;cursor:pointer;margin:0}
.check input:checked{background:var(--paper)}
.check input:checked::after{content:"";width:10px;height:10px;background:var(--flame)}
.check small{font:400 11px var(--mono);color:var(--dim)}
.status{min-height:1.5em;color:var(--acid)}
.status.err{color:var(--flame)}

.saved{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:3px solid var(--line)}
.saved li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(239,233,220,.25)}
.saved canvas{width:48px;height:48px;background:var(--paper)}
.saved button.load{all:unset;cursor:pointer;min-width:0}
.saved button.load:focus-visible{outline:3px dashed var(--acid)}
.saved b{display:block;font:900 17px/1.2 var(--goth);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved span{display:block;color:var(--dim)}
.saved .del{background:transparent;border:2px solid var(--dim);color:var(--dim);width:30px;height:30px;font:700 14px var(--mono)}
.saved .del:hover{border-color:var(--flame);color:var(--flame)}
.empty{color:var(--dim);margin:0}
.foot{padding:18px 22px 28px;color:var(--dim)}

@media (max-width:900px){
  .app{height:auto;min-height:100%}
  .work{grid-template-columns:1fr}
  .panel{border-left:0;overflow:visible}
  .canvas-zone{padding:18px var(--gr) 22px var(--gl)}
  .group{padding-left:var(--gl);padding-right:var(--gr)}
  .foot{padding-left:var(--gl);padding-right:var(--gr)}
  .readout div{flex-basis:45%}
  .readout div:nth-child(2){border-right:0}
  .readout div:nth-child(-n+2){border-bottom:3px solid var(--line)}
}
@media (max-width:420px){
  .brand span{display:none}
  .tabs{width:100%}
  .tabs a{flex:1;justify-content:center}
  .chips{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><b>완독<i>지문</i></b><span class="mono">TONGDOK® · 1,189장 완독자 전용 · 1 OF 1</span></div>
    <nav class="tabs" aria-label="만들 것">
      <a href="#poster" data-view="poster">포스터 <small>A2</small></a>
      <a href="#cert" data-view="cert">증명서 <small>A4</small></a>
    </nav>
  </header>

  <main class="work">
    <section class="stage" aria-label="미리보기">
      <div class="canvas-zone" id="zone">
        <div class="sheet"><canvas id="view" role="img" aria-label="미리보기"></canvas></div>
      </div>
      <div class="readout" aria-live="polite">
        <div><b id="r-days">—</b><span>읽은 날 / 전체 기간</span></div>
        <div><b id="r-best">—</b><span>최장 연속</span></div>
        <div><b id="r-hot">—</b><span>10장 이상 읽은 날</span></div>
        <div class="fp"><b id="r-fp">—</b><span>지문 ID</span></div>
      </div>
    </section>

    <aside class="panel">
      <form id="form" autocomplete="off">
        <div class="group">
          <h2>기록 <small id="sample-note">예시 기록</small></h2>
          <label class="field"><span>이름 <em class="mono">포스터 하단 초대형</em></span><input type="text" id="f-name" maxlength="24" placeholder="이름"></label>
          <div class="two">
            <label class="field"><span>시작일 <em class="mono">중심</em></span><input type="date" id="f-start"></label>
            <label class="field"><span>완독일 <em class="mono">바깥</em></span><input type="date" id="f-end"></label>
          </div>
          <div class="two">
            <label class="field"><span>완독 번호</span><input type="text" id="f-no" inputmode="numeric" maxlength="4" placeholder="0047"></label>
            <label class="field"><span>교회명 <em class="mono">선택</em></span><input type="text" id="f-church" maxlength="24" placeholder="없음"></label>
          </div>
          <div class="field"><span>주로 읽은 시간대</span><div class="seg" id="f-slot" role="group" aria-label="주로 읽은 시간대"></div></div>
          <div class="field"><span>꾸준함 <em class="mono">읽은 날 비율</em></span><div class="rng"><input type="range" id="f-c" min="45" max="100" aria-label="꾸준함"><output id="o-c" for="f-c">82%</output></div></div>
          <label class="field" id="quoteField"><span>하단 한 줄 <em class="mono">포스터 전용</em></span><input type="text" id="f-quote" maxlength="60" placeholder="한 장씩, 끝까지."></label>
          <button type="button" class="btn line" id="shuffle">↻ 다른 사람 기록으로</button>
        </div>

        <div class="group">
          <h2>컬러</h2>
          <div class="chips" id="f-theme" role="group" aria-label="컬러"></div>
        </div>

        <div class="group">
          <h2>내보내기 <small id="spec">A2 · 420×594mm · 300dpi</small></h2>
          <label class="check" id="bleedRow"><input type="checkbox" id="f-bleed" checked> 재단 여유 3mm <small>426×600mm</small></label>
          <div class="row">
            <button type="button" class="btn" id="png">PNG <small>300dpi</small></button>
            <button type="button" class="btn" id="pdf">PDF <small>JPEG 95%</small></button>
          </div>
          <p class="status mono" id="status" role="status"></p>
        </div>

        <div class="group">
          <h2>보관함 <small>이 브라우저에만 저장</small></h2>
          <button type="button" class="btn line" id="keep">＋ 지금 기록 보관</button>
          <ul class="saved" id="saved"></ul>
        </div>
      </form>
      <p class="foot mono">시안 단계라 입력값을 시드로 한 결정적 의사난수 기록을 씁니다. 같은 입력이면 같은 지문이 나오고, 합계는 언제나 1,189장입니다. 성경 본문은 넣지 않습니다.</p>
    </aside>
  </main>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   TONGDOK® 완독지문 — 공용 코어 (포스터·증명서가 같은 코드를 씁니다)
   기록 생성 → 지문 기하 → 렌더 → 300dpi 내보내기
   ───────────────────────────────────────────────────────────── */
const TONGDOK = (() => {
  'use strict';
  const TOTAL = 1189;
  const DAY = 86400000;
  const POSTER = { w: 1200, h: 1697, mmW: 420, mmH: 594 };
  const CERT = { w: 1697, h: 1200, mmW: 297, mmH: 210 };
  const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';

  const SLOTS = {
    dawn: { label: '새벽', center: 5, range: '04–06시' },
    morning: { label: '아침', center: 7, range: '06–09시' },
    lunch: { label: '점심', center: 12, range: '11–13시' },
    night: { label: '밤', center: 22, range: '21–24시' },
  };

  const THEMES = {
    CREAM: { bg: '#efe9dc', ink: '#0f0f0f', sub: 'rgba(15,15,15,.6)', ridge: '#0f0f0f', hot: '#ff4d12', accent: '#ff4d12', panel: '#ff4d12', panelInk: '#0f0f0f', sw: ['#efe9dc', '#0f0f0f', '#ff4d12'] },
    ACID: { bg: '#0f0f0f', ink: '#d4ff3a', sub: 'rgba(239,233,220,.62)', ridge: '#efe9dc', hot: '#d4ff3a', accent: '#d4ff3a', panel: '#d4ff3a', panelInk: '#0f0f0f', sw: ['#0f0f0f', '#d4ff3a'] },
    BLAZE: { bg: '#ff4d12', ink: '#0f0f0f', sub: 'rgba(15,15,15,.66)', ridge: '#0f0f0f', hot: '#efe9dc', accent: '#efe9dc', panel: '#efe9dc', panelInk: '#0f0f0f', sw: ['#ff4d12', '#0f0f0f', '#efe9dc'] },
    CHURCH: { bg: '#1d2536', ink: '#c6ad82', sub: 'rgba(239,233,220,.6)', ridge: '#e8e1d2', hot: '#c6ad82', accent: '#c6ad82', panel: '#c6ad82', panelInk: '#1d2536', sw: ['#1d2536', '#c6ad82'] },
  };

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ── 결정적 의사난수 ───────────────────────────── */
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return () => {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rngFrom = (str) => mulberry32(xmur3(str)());
  function gauss(r) {
    let u = 0;
    while (u === 0) u = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r());
  }

  /* ── 날짜 (UTC로만 계산해 서머타임 영향 없음) ─── */
  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function fmtDate(t, sep = '.') {
    const d = new Date(t);
    return d.getUTCFullYear() + sep + String(d.getUTCMonth() + 1).padStart(2, '0') + sep + String(d.getUTCDate()).padStart(2, '0');
  }
  const isoDate = (t) => fmtDate(t, '-');

  /* ── 입력 정리 ───────────────────────────────── */
  function normalize(inp) {
    const name = String(inp.name || '').trim().slice(0, 24) || '이름';
    const digits = String(inp.no || '').replace(/\D/g, '').slice(-4);
    const no = (digits || '1').padStart(4, '0');
    let s = parseDate(inp.start);
    let e = parseDate(inp.end);
    if (s == null) s = Date.UTC(2025, 0, 1);
    if (e == null) e = s + 364 * DAY;
    if (e < s) [s, e] = [e, s];
    let days = Math.round((e - s) / DAY) + 1;
    if (days < 40) { days = 40; e = s + 39 * DAY; }
    if (days > 1460) { days = 1460; e = s + 1459 * DAY; }
    return {
      name, no, start: s, end: e, days,
      slot: SLOTS[inp.slot] ? inp.slot : 'dawn',
      consistency: clamp(Math.round(+inp.consistency || 80), 45, 100),
      quote: String(inp.quote || '').trim().slice(0, 60),
      church: String(inp.church || '').trim().slice(0, 24),
      theme: THEMES[inp.theme] ? inp.theme : 'CREAM',
    };
  }

  /* ── 날짜별 기록 생성: 합계 정확히 1,189장 ───── */
  function generateRecord(n) {
    const r = rngFrom(['REC', n.name, n.no, n.start, n.end, n.slot, n.consistency].join('|'));
    const N = n.days;
    const read = new Array(N).fill(true);
    const target = clamp(Math.round((N * n.consistency) / 100), 2, Math.min(N, TOTAL));
    let off = N - target;

    // 가끔 찾아오는 8~38일짜리 긴 공백
    if (off >= 8) {
      let budget = Math.floor(off * (0.35 + r() * 0.35));
      for (let t = 0; t < 300 && budget >= 8; t++) {
        const len = Math.min(budget, 8 + Math.floor(r() * 31));
        const room = N - len - 4;
        if (room < 2) break;
        const s = 2 + Math.floor(r() * room);
        let ok = true;
        for (let i = s - 3; i < s + len + 3; i++) if (i >= 0 && i < N && !read[i]) { ok = false; break; }
        if (!ok) continue;
        for (let i = s; i < s + len; i++) read[i] = false;
        budget -= len;
        off -= len;
      }
    }
    // 나머지는 하루이틀씩 흩어진 쉼 (첫날·마지막 날은 항상 읽은 날)
    for (let t = 0; t < N * 40 && off > 0; t++) {
      const i = 1 + Math.floor(r() * (N - 2));
      if (!read[i]) continue;
      const len = r() < 0.28 ? 2 + Math.floor(r() * 2) : 1;
      for (let k = 0; k < len && off > 0 && i + k < N - 1; k++) if (read[i + k]) { read[i + k] = false; off--; }
    }

    // 장 수 분배: 읽은 날마다 최소 1장 + 나머지를 가중치로 최대잉여법 배분
    const idx = [];
    for (let i = 0; i < N; i++) if (read[i]) idx.push(i);
    const R = idx.length;
    const extra = TOTAL - R;
    const dow0 = new Date(n.start).getUTCDay();
    const w = idx.map((i) => {
      let v = Math.exp(0.55 * gauss(r));
      if (r() < 0.07) v *= 2.4 + r() * 2.6; // 몰아 읽은 날
      if ((dow0 + i) % 7 === 0) v *= 1.35; // 주일
      return v;
    });
    const W = w.reduce((a, b) => a + b, 0);
    const exact = w.map((v) => (v / W) * extra);
    const base = exact.map(Math.floor);
    const rem = extra - base.reduce((a, b) => a + b, 0);
    exact.map((v, k) => [v - base[k], k]).sort((a, b) => b[0] - a[0] || a[1] - b[1])
      .slice(0, rem).forEach(([, k]) => base[k]++);

    const center = SLOTS[n.slot].center;
    const days = new Array(N);
    let k = 0;
    for (let i = 0; i < N; i++) {
      if (!read[i]) { days[i] = { read: false, ch: 0, hour: null }; continue; }
      let h = r() < 0.72 ? Math.round(center + gauss(r) * 0.9) : 6 + Math.floor(r() * 18);
      h = ((h % 24) + 24) % 24;
      days[i] = { read: true, ch: 1 + base[k++], hour: h };
    }

    // 통계
    let streak = 0, best = 0, maxCh = 0, hot = 0;
    const hc = new Array(24).fill(0);
    for (const d of days) {
      if (d.read) {
        best = Math.max(best, ++streak);
        maxCh = Math.max(maxCh, d.ch);
        if (d.ch >= 10) hot++;
        hc[d.hour]++;
      } else streak = 0;
    }
    const topHour = hc.indexOf(Math.max(...hc));

    // 지문 ID: 날짜별 장 수 배열 해시 — 한 장만 달라도 바뀐다
    const hf = xmur3('FP|' + isoDate(n.start) + '|' + days.map((d) => d.ch).join(','));
    const hex = hf().toString(16).padStart(8, '0').toUpperCase();
    const verify = hf().toString(16).padStart(8, '0').slice(0, 4);

    return {
      days, readDays: R, total: N, best, topHour, maxCh, hot,
      sum: days.reduce((a, d) => a + d.ch, 0),
      fp: 'FP-' + hex.slice(0, 4) + '-' + hex.slice(4),
      verify,
      url: 'tongdok.app/v/' + n.no + '-' + verify,
    };
  }

  /* ── 지문 모양: 이름+번호로만 결정 ─────────────── */
  function makeShape(n) {
    const r = rngFrom('SHAPE|' + n.name + '|' + n.no);
    const left = r() < 0.5;
    const dAng = (left ? Math.PI * 0.72 : Math.PI * 0.28) + (r() - 0.5) * 0.45;
    const dR = 0.56 + r() * 0.14;
    return {
      key: n.name + '|' + n.no,
      rot: r() * Math.PI * 2,
      dir: r() < 0.5 ? 1 : -1,
      ex: 0.8 + r() * 0.07, // 세로로 살짝 긴 타원
      ey: 1,
      waves: [2, 3, 5].map((k) => ({ k, a: 0.016 + r() * 0.026, p: r() * Math.PI * 2, c: (r() * 2 - 1) * 2.6 })),
      core: { x: (r() - 0.5) * 0.1, y: -(0.04 + r() * 0.07) },
      dx: Math.cos(dAng) * dR * 0.82,
      dy: Math.sin(dAng) * dR,
      dA: 0.065 + r() * 0.035,
      dS: 0.2 + r() * 0.06,
      dRot: r() * Math.PI * 2,
      tj: r(),
    };
  }

  function warp(sh, r, phi) {
    let m = 0;
    for (const w of sh.waves) m += w.a * Math.sin(w.k * phi + w.p + w.c * r);
    const rr = r * (1 + m * Math.min(1, r * 5));
    let x = rr * Math.cos(phi) * sh.ex;
    let y = rr * Math.sin(phi) * sh.ey;
    const f = (1 - r) * (1 - r); // 안쪽 코어만 살짝 위로 밀어 루프 느낌
    x += sh.core.x * f;
    y += sh.core.y * f;
    // 삼각주(델타): 한 점에서 결을 밀어내 세 갈래로 눌린 자리를 만든다
    const dx = x - sh.dx, dy = y - sh.dy, d = Math.hypot(dx, dy) + 1e-6;
    const amp = sh.dA * Math.exp(-(d * d) / (sh.dS * sh.dS)) * (1 + 0.4 * Math.cos(3 * Math.atan2(dy, dx) - sh.dRot));
    return [x + (dx / d) * amp, y + (dy / d) * amp];
  }

  /* ── 기하: 하루 = 나선의 한 마디, 중심 = 첫날 ─── */
  function buildGeom(rec, sh) {
    const N = rec.days.length;
    const T = clamp(14 + (N - 90) * 0.032 + (sh.tj - 0.5) * 2, 14, 46);
    const r0 = 0.035, Th = 2 * Math.PI * T, b = (1 - r0) / Th, ring = (1 - r0) / T;
    const S = r0 * Th + (b * Th * Th) / 2; // 아르키메데스 나선 전체 길이
    const thetaAt = (s) => (-r0 + Math.sqrt(r0 * r0 + 2 * b * s)) / b;
    // 마디 길이 ±40%: 끊긴 자리가 바큇살처럼 정렬되지 않게
    const lr = rngFrom('LEN|' + sh.key + '|' + N);
    const L = new Array(N);
    let sum = 0;
    for (let i = 0; i < N; i++) sum += L[i] = 1 + 0.4 * (2 * lr() - 1);
    const segs = [];
    const step = 0.0055;
    let acc = 0;
    for (let i = 0; i < N; i++) {
      const s0 = (acc / sum) * S;
      acc += L[i];
      const s1 = (acc / sum) * S;
      const d = rec.days[i];
      if (!d.read) continue; // 쉰 날 = 끊김
      const w = ring * (0.12 + 0.6 * Math.min(1, d.ch / 18));
      const g = ring * 0.3 + w; // 마디 사이 틈 (둥근 끝 보정 포함)
      let a = s0 + g / 2, e = s1 - g / 2;
      if (e - a < ring * 0.12) { const mid = (s0 + s1) / 2; a = mid - ring * 0.06; e = mid + ring * 0.06; }
      const n = Math.max(2, Math.ceil((e - a) / step) + 1);
      const pts = new Float32Array(n * 2);
      for (let k = 0; k < n; k++) {
        const t = thetaAt(a + ((e - a) * k) / (n - 1));
        const p = warp(sh, r0 + b * t, sh.rot + sh.dir * t);
        pts[2 * k] = p[0];
        pts[2 * k + 1] = p[1];
      }
      segs.push({ i, pts, w, hot: d.ch >= 10 });
    }
    return { segs, ring, T, N };
  }

  /* o: {cx, cy, R, ridge, hot, upto?, push?, aRidge?, aHot?} */
  function drawFP(ctx, geom, o) {
    const { cx, cy, R } = o;
    const upto = o.upto == null ? Infinity : o.upto;
    const P = o.push && o.push.a > 0.0005 ? o.push : null;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const sg of geom.segs) {
      if (sg.i >= upto) break;
      const p = sg.pts;
      let n = p.length / 2;
      if (upto - sg.i < 1) n = Math.max(2, Math.floor(n * (upto - sg.i)));
      ctx.beginPath();
      for (let k = 0; k < n; k++) {
        let x = p[2 * k], y = p[2 * k + 1];
        if (P) {
          const dx = x - P.x, dy = y - P.y, d2 = dx * dx + dy * dy;
          const f = P.a * Math.exp(-d2 / (P.s * P.s)), d = Math.sqrt(d2) + 1e-6;
          x += (dx / d) * f;
          y += (dy / d) * f;
        }
        if (k) ctx.lineTo(cx + x * R, cy + y * R);
        else ctx.moveTo(cx + x * R, cy + y * R);
      }
      ctx.lineWidth = sg.w * R;
      ctx.strokeStyle = sg.hot ? o.hot : o.ridge;
      ctx.globalAlpha = sg.hot ? (o.aHot ?? 1) : (o.aRidge ?? 1);
      ctx.stroke();
    }
    ctx.restore();
  }

  function compute(inp) {
    const n = normalize(inp);
    const rec = generateRecord(n);
    const geom = buildGeom(rec, makeShape(n));
    return { n, rec, geom };
  }

  /* ── 타이포 헬퍼 ─────────────────────────────── */
  const F = {
    goth: '"Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif',
    anton: 'Anton, "Gothic A1", Impact, sans-serif',
    mono: '"Space Mono", "Gothic A1", ui-monospace, monospace',
  };
  const font = (ctx, w, size, fam) => { ctx.font = `${w} ${size}px ${fam}`; };
  function fit(ctx, text, w, size, fam, maxW) {
    font(ctx, w, size, fam);
    const m = ctx.measureText(text).width;
    if (m > maxW) { size = Math.floor((size * maxW) / m); font(ctx, w, size, fam); }
    return size;
  }
  const track = (ctx, px) => { if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; };

  const STATIC_TEXT = '완독지문번호전용자읽은날최장연속주로시각하루최다장일시쉰이상중심첫바깥완독증명서성경권처음부터끝까지이사람은전체를었음을지문으로합니다발급기간확인담당목회서명인통독앱기록자동생되었습니다한만달라도바뀝니본미포함';
  const loaded = new Set();
  function ensureFonts(text) {
    if (!document.fonts || !document.fonts.load) return Promise.resolve(false);
    const missing = [...new Set(STATIC_TEXT + (text || '') + '0123456789')].filter((c) => !loaded.has(c)).join('');
    if (!missing) return Promise.resolve(false);
    [...missing].forEach((c) => loaded.add(c));
    const specs = ['900 40px "Gothic A1"', '800 40px "Gothic A1"', '700 40px "Gothic A1"', '40px Anton', '400 40px "Space Mono"', '700 40px "Space Mono"'];
    return Promise.all(specs.map((f) => document.fonts.load(f, missing).catch(() => []))).then(() => true);
  }

  function stamp(ctx, x, y, r, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, r - 26, 0, Math.PI * 2); ctx.stroke();
    const ring = 'TONGDOK · 1,189 CHAPTERS · COMPLETED · ';
    font(ctx, 700, 13, F.mono);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const step = (Math.PI * 2) / ring.length;
    for (let i = 0; i < ring.length; i++) {
      ctx.save();
      ctx.rotate(i * step);
      ctx.fillText(ring[i], 0, -(r - 14));
      ctx.restore();
    }
    font(ctx, 900, 38, F.goth);
    ctx.fillText('완독자', 0, -18);
    ctx.fillText('전용', 0, 26);
    ctx.restore();
  }

  /* ── 포스터 (논리 1200×1697) ──────────────────── */
  function renderPoster(ctx, st, opt = {}) {
    const { n, rec, geom } = st;
    const T = THEMES[n.theme];
    const W = POSTER.w, H = POSTER.h, b = opt.bleed || 0, M = 60;
    const FP = { cx: 792, cy: 866, R: 404 };
    ctx.save();
    ctx.fillStyle = T.bg;
    ctx.fillRect(-b, -b, W + 2 * b, H + 2 * b); // 재단 여유까지 배경색
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    drawFP(ctx, geom, { ...FP, ridge: T.ridge, hot: T.hot, upto: opt.upto });

    // 머리
    ctx.fillStyle = T.ink;
    font(ctx, 700, 17, F.mono);
    ctx.fillText('TONGDOK® 완독지문', M, 70);
    ctx.textAlign = 'right';
    ctx.fillText(n.church ? n.church + ' · 1 OF 1' : '1 OF 1 · EDITION 01', W - M, 70);
    ctx.textAlign = 'left';
    ctx.fillRect(M, 86, W - 2 * M, 4);
    font(ctx, 400, 18, F.mono);
    ctx.fillText('완독 번호 — NO.', M, 132);

    // 거대한 완독 번호
    fit(ctx, n.no, 400, 372, F.anton, 690);
    ctx.fillText(n.no, M - 8, 500);

    stamp(ctx, 226, 712, 104, -0.24, T.accent);

    // 왼쪽 기술 표기 칼럼
    const col = [
      ['FINGERPRINT ID', rec.fp],
      ['RINGS', geom.T.toFixed(1)],
      ['쉰 날 / GAPS', rec.total - rec.readDays + '일'],
      ['10장+ 날', rec.hot + '일'],
    ];
    let y = 900;
    for (const [k, v] of col) {
      ctx.fillStyle = T.sub; font(ctx, 400, 14, F.mono); ctx.fillText(k, M, y);
      ctx.fillStyle = T.ink; font(ctx, 700, 21, F.mono); ctx.fillText(v, M, y + 27);
      y += 64;
    }
    // 날짜별 장 수 바코드
    const bx = M, bw = 330, base = 1262, bh = 56;
    ctx.fillStyle = T.sub; font(ctx, 400, 13, F.mono); ctx.fillText('DAILY CHAPTERS →', bx, base - bh - 10);
    const cw = bw / rec.total;
    rec.days.forEach((d, i) => {
      if (!d.read) return;
      const h = 4 + (d.ch / rec.maxCh) * (bh - 4);
      ctx.fillStyle = d.ch >= 10 ? T.hot : T.ink;
      ctx.fillRect(bx + i * cw, base - h, Math.max(0.8, cw * 0.72), h);
    });

    // 하단
    ctx.fillStyle = T.ink;
    ctx.fillRect(M, 1284, W - 2 * M, 8);
    font(ctx, 400, 18, F.mono);
    ctx.fillText(fmtDate(n.start) + ' → ' + fmtDate(n.end), M, 1322);
    ctx.textAlign = 'right';
    ctx.fillText(rec.total + '일 · 66권 · 1,189장', W - M, 1322);
    ctx.textAlign = 'left';

    track(ctx, -4);
    fit(ctx, n.name, 900, 132, F.goth, W - 2 * M);
    ctx.fillText(n.name, M - 4, 1452);
    track(ctx, 0);

    const stats = [
      [rec.readDays + '/' + rec.total, '읽은 날 / 전체 기간'],
      [rec.best + '일', '최장 연속'],
      [String(rec.topHour).padStart(2, '0') + '시', '주로 읽은 시각'],
      [rec.maxCh + '장', '하루 최다'],
    ];
    const cwid = (W - 2 * M) / 4;
    stats.forEach(([v, k], i) => {
      const x = M + i * cwid + (i ? 20 : 0);
      if (i) { ctx.fillStyle = T.ink; ctx.fillRect(M + i * cwid, 1488, 3, 86); }
      ctx.fillStyle = T.ink;
      fit(ctx, v, 400, 62, F.anton, cwid - 30);
      ctx.fillText(v, x, 1544);
      ctx.fillStyle = T.sub;
      font(ctx, 700, 17, F.goth);
      ctx.fillText(k, x, 1572);
    });

    ctx.fillStyle = T.ink;
    ctx.fillRect(M, 1592, W - 2 * M, 2);
    fit(ctx, n.quote || '한 장씩, 끝까지.', 800, 27, F.goth, W - 2 * M);
    ctx.fillText(n.quote || '한 장씩, 끝까지.', M, 1634);

    // 범례
    const ringPx = geom.ring * FP.R;
    const ly = 1670;
    let lx = M;
    font(ctx, 400, 13, F.mono);
    const seg = (w, c, gap) => {
      ctx.save();
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round';
      ctx.beginPath();
      if (gap) { ctx.moveTo(lx, ly - 5); ctx.lineTo(lx + 10, ly - 5); ctx.moveTo(lx + 22, ly - 5); ctx.lineTo(lx + 32, ly - 5); }
      else { ctx.moveTo(lx, ly - 5); ctx.lineTo(lx + 32, ly - 5); }
      ctx.stroke(); ctx.restore();
      lx += 42;
    };
    const lab = (t) => { ctx.fillStyle = T.sub; ctx.fillText(t, lx, ly); lx += ctx.measureText(t).width + 24; };
    seg(ringPx * 0.153, T.ink); lab('1장');
    seg(ringPx * 0.72, T.ink); lab('18장+');
    seg(ringPx * 0.5, T.hot); lab('10장 이상');
    seg(ringPx * 0.3, T.ink, true); lab('쉰 날');
    lab('중심=첫날 · 바깥=완독일');
    ctx.textAlign = 'right';
    ctx.fillText(rec.url, W - M, ly);
    ctx.restore();
  }

  /* ── QR (바이트 모드, 오류정정 M, 버전 1–6) ──── */
  const QR_M = [null, [10, 1, 16], [16, 1, 28], [26, 1, 44], [18, 2, 32], [24, 2, 43], [16, 4, 27]];
  const QR_ALIGN = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34]];
  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; }
    return z & 255;
  }
  function rsDivisor(deg) {
    const res = new Array(deg).fill(0);
    res[deg - 1] = 1;
    let root = 1;
    for (let i = 0; i < deg; i++) {
      for (let j = 0; j < deg; j++) { res[j] = gfMul(res[j], root); if (j + 1 < deg) res[j] ^= res[j + 1]; }
      root = gfMul(root, 2);
    }
    return res;
  }
  function rsRemainder(data, div) {
    const res = div.map(() => 0);
    for (const v of data) {
      const f = v ^ res.shift();
      res.push(0);
      div.forEach((c, i) => { res[i] ^= gfMul(c, f); });
    }
    return res;
  }
  function qrMatrix(text) {
    const bytes = [...new TextEncoder().encode(text)];
    let ver = 1;
    while (ver <= 6 && QR_M[ver][1] * QR_M[ver][2] < bytes.length + 2) ver++;
    if (ver > 6) return null;
    const [ecLen, blocks, dataPer] = QR_M[ver];
    const cap = blocks * dataPer;
    // 비트열
    const bits = [];
    const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, 8); bytes.forEach((v) => put(v, 8));
    put(0, Math.min(4, cap * 8 - bits.length));
    while (bits.length % 8) bits.push(0);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));
    for (let p = 0; data.length < cap; p++) data.push(p % 2 ? 0x11 : 0xec);
    // 블록 + RS + 인터리브
    const div = rsDivisor(ecLen);
    const dB = [], eB = [];
    for (let k = 0; k < blocks; k++) { const d = data.slice(k * dataPer, (k + 1) * dataPer); dB.push(d); eB.push(rsRemainder(d, div)); }
    const all = [];
    for (let i = 0; i < dataPer; i++) dB.forEach((d) => all.push(d[i]));
    for (let i = 0; i < ecLen; i++) eB.forEach((e) => all.push(e[i]));

    const size = ver * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setF = (x, y, v) => { mod[y][x] = v; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx, y = cy + dy, dist = Math.max(Math.abs(dx), Math.abs(dy));
        if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, dist !== 2 && dist !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const al = QR_ALIGN[ver];
    al.forEach((ay, i) => al.forEach((ax, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === al.length - 1) || (i === al.length - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setF(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
    const drawFormat = (mask) => {
      const d = (0 << 3) | mask; // M = 00
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const fb = ((d << 10) | rem) ^ 0x5412;
      const g = (i) => ((fb >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) setF(8, i, g(i));
      setF(8, 7, g(6)); setF(8, 8, g(7)); setF(7, 8, g(8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, g(i));
      for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, g(i));
      for (let i = 8; i < 15; i++) setF(8, size - 15 + i, g(i));
      setF(8, size - 8, true);
    };
    drawFormat(0);
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - v : v;
        if (!fn[y][x] && bi < all.length * 8) { mod[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) === 1; bi++; }
      }
    }
    const maskFn = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,

  const CRC_T = (() => {

  // 렌더 함수 하나 + scale만 바꿔 고해상도
  function renderHiRes(kind, st, bleed) {

<script>

    $('#bleedRow').hidden = v !== 'poster';
    $('#quoteField').style.opacity = v === 'poster' ? '1' : '.45';
    $('#spec').textContent = v === 'poster' ? 'A2 · 420×594mm · 300dpi' : 'A4 가로 · 297×210mm · 300dpi';
    cv.setAttribute('aria-label', v === 'poster' ? '완독지문 포스터 미리보기' : '완독 증명서 미리보기');
    fit();
  }
  addEventListener('hashchange', () => setView(location.hash === '#cert' ? 'cert' : 'poster'));

  $('#shuffle').onclick = () => {
    const names = ['이서연', '박지호', '최예준', '정하은', '강민재', '윤소망', '장은총', '임다니엘', '한요셉', '오사랑', '신믿음', '배주안'];
    const quotes = ['한 장씩, 끝까지.', '멈췄다가, 다시.', '새벽 다섯 시의 일 년.', '출퇴근 지하철 40분.', '점심시간 십오 분.', '아이 재우고 나서.'];
    const r = Math.random, slots = Object.keys(T.SLOTS);
    const s = Date.UTC(2024, 0, 1) + Math.floor(r() * 600) * 864e5;
    Object.assign(state, {
      name: names[Math.floor(r() * names.length)], no: String(1 + Math.floor(r() * 100)).padStart(4, '0'),
      start: T.isoDate(s), end: T.isoDate(s + Math.floor(150 + r() * 560) * 864e5),
      slot: slots[Math.floor(r() * 4)], consistency: 45 + Math.floor(r() * 56), quote: quotes[Math.floor(r() * quotes.length)],
    });
    changed();
  };

  /* ── 내보내기: 뷰어 안에서는 downloads 기능, 단독 파일이면 일반 다운로드 ── */
  const status = $('#status');
  const say = (t, err) => { status.textContent = t; status.classList.toggle('err', !!err); };
  async function saveFile(blob, filename) {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use('downloads');
      if (!dl) throw { code: 'unavailable' };
      await dl.save({ filename, data: blob });
      return;
    }
    T.download(blob, filename);
  }
  async function exportAs(kind) {
    const btns = [$('#png'), $('#pdf')];
    btns.forEach((b) => (b.disabled = true));
    const poster = view === 'poster';
    const bleed = poster && state.bleed;
    say('300dpi로 그리는 중… 몇 초 걸립니다.');
    await new Promise((r) => setTimeout(r, 40));
    try {
      await T.ensureFonts(cur.n.name + cur.n.quote + cur.n.church);
      const st = T.compute(state);
      const base = poster ? `완독지문_${st.n.no}_${st.n.name}_A2_300dpi${bleed ? '_bleed3mm' : ''}` : `완독증명서_${st.n.no}_${st.n.name}_A4_300dpi`;
      const blob = kind === 'png' ? await T.makePNG(view, st, bleed) : await T.makePDF(view, st, bleed);
      say('파일 준비 완료 (' + (blob.size / 1048576).toFixed(1) + 'MB). 저장을 확인해 주세요.');
      await saveFile(blob, base + '.' + kind);
      say('저장했습니다: ' + base + '.' + kind);
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') say('저장을 취소했습니다.');
      else if (code === 'rate_limited') say('이미 저장 확인 창이 열려 있습니다. 잠시 후 다시 눌러 주세요.', true);
      else if (code === 'too_large') say('파일이 너무 큽니다. PDF로 저장해 보세요.', true);
      else if (code === 'unavailable' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') say('이 화면에서는 파일을 저장할 수 없습니다. claude.ai에서 열어 주세요.', true);
      else say('실패: ' + ((e && e.message) || code || '알 수 없는 오류'), true);
    } finally {
      btns.forEach((b) => (b.disabled = false));
    }
  }
  $('#png').onclick = () => exportAs('png');
  $('#pdf').onclick = () => exportAs('pdf');

  /* ── 보관함 ── */
  let saved = store.get('wandok.saved', []);
  function renderSaved() {
    const ul = $('#saved');
    ul.textContent = '';
    if (!saved.length) {
      const li = document.createElement('li');
      li.innerHTML = '<p class="empty mono" style="grid-column:1/-1">아직 보관한 기록이 없습니다. 위 버튼으로 지금 지문을 남겨 두면 언제든 다시 불러올 수 있습니다.</p>';
      ul.appendChild(li);
      return;
    }
    saved.forEach((s, i) => {
      const st = T.compute(s);
      const li = document.createElement('li');
      const c = document.createElement('canvas');
      c.width = c.height = 96;
      const th = T.THEMES[st.n.theme];
      const g = c.getContext('2d');
      g.fillStyle = th.bg; g.fillRect(0, 0, 96, 96);
      T.drawFP(g, st.geom, { cx: 48, cy: 48, R: 44, ridge: th.ridge, hot: th.hot });
      const load = document.createElement('button');
      load.type = 'button'; load.className = 'load';
      load.innerHTML = '';
      const b = document.createElement('b'); b.textContent = st.n.name + ' · ' + st.n.no;
      const sp = document.createElement('span'); sp.className = 'mono'; sp.textContent = T.fmtDate(st.n.start) + ' → ' + T.fmtDate(st.n.end) + ' · ' + st.rec.fp;
      load.append(b, sp);
      load.onclick = () => { Object.assign(state, s); changed(); say(st.n.name + '님의 기록을 불러왔습니다.'); };
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '✕';
      del.setAttribute('aria-label', st.n.name + ' 기록 삭제');
      del.onclick = () => { saved.splice(i, 1); store.set('wandok.saved', saved); renderSaved(); };
      li.append(c, load, del);
      ul.appendChild(li);
    });
  }
  $('#keep').onclick = () => {
    const s = pick(state);
    const key = JSON.stringify(s);
    saved = [s, ...saved.filter((x) => JSON.stringify(x) !== key)].slice(0, 24);
    store.set('wandok.saved', saved);
    renderSaved();
    say('보관함에 담았습니다.');
  };

  /* ── 시작 ── */
  sync();
  cur = T.compute(state);
  readout();
  renderSaved();
  new ResizeObserver(fit).observe(zone);
  setView(view);
  playGrow();
  T.ensureFonts(state.name + state.quote + state.church).then(draw);
  if (document.fonts) {
    document.fonts.ready.then(draw);
    document.fonts.addEventListener('loadingdone', draw);
  }
})();
</script>
</body>
</html>
